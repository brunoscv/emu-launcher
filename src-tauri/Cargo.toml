[package]
name = "emu-launcher"
version = "0.1.0"
description = "Launcher de emuladores estilo Batocera"
authors = ["Bruno Carvalho"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
sevenz-rust = "0.6"

# Descomente quando começar a seção de netplay (fase 4/5 do plano):
# tokio-tungstenite = "0.21"
# webrtc = "0.11"

[[bin]]
name = "emu-launcher"
path = "src/main.rs"
