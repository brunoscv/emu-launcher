[package]
name = "emu-launcher"
version = "0.1.0"
description = "Launcher de emuladores estilo Batocera"
authors = ["Bruno Carvalho"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sevenz-rust = "0.6"
dotenvy = "0.15"
tokio-tungstenite = "0.24"

# Descomente quando chegar na fase de netplay via WebRTC (arquitetura de
# streaming, decisão #6 do CLAUDE.md — mais distante, não é o modo servidor
# atual que reusa o RetroArch nativo):
# webrtc = "0.11"

[[bin]]
name = "emu-launcher"
path = "src/main.rs"
